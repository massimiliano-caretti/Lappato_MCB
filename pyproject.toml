[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lappato_mcb"
version = "1.6.1"
description = "Literature-aware framework for machine-learning pipelines"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Massimiliano Caretti", email = "massimiliano.caretti@gmail.com" }
]
keywords = [
  "machine-learning",
  "literature-search",
  "arxiv",
  "openalex",
  "crossref",
  "joss",
  "pipeline-monitoring",
  "research-software",
  "mcp",
  "model-context-protocol",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.optional-dependencies]
examples = [
  "numpy",
  "scikit-learn",
  "lightgbm",
]
reports = [
  "matplotlib",
]
# v1.6 — accelerates the new insight detectors' statistical helpers.
# Without this extra LAPPATO_MCB still works (pure-Python Numerical
# Recipes fallbacks ship in lappato_mcb._stats); installing scipy is
# purely for numerical robustness on edge-case tables and a small
# speed-up on very large pipelines.
insights = [
  "scipy",
]
# v1.7 — Model Context Protocol server (``lappato-mcb-mcp``). The SDK
# requires Python >= 3.10; on 3.9 the extra installs nothing and the
# entry point exits with an explanatory message. The core library
# never imports it.
mcp = [
  "mcp>=2.3,<3; python_version >= '3.10'",
]
dev = [
  "pytest",
  "build",
]
all = [
  "numpy",
  "scikit-learn",
  "lightgbm",
  "matplotlib",
  "scipy",
  "mcp>=2.3,<3; python_version >= '3.10'",
]

[project.scripts]
lappato-mcb-mcp = "lappato_mcb.mcp_server.__main__:main"

[project.urls]
Homepage = "https://github.com/massimiliano-caretti/Lappato_MCB"
Repository = "https://github.com/massimiliano-caretti/Lappato_MCB"
Issues = "https://github.com/massimiliano-caretti/Lappato_MCB/issues"
Documentation = "https://github.com/massimiliano-caretti/Lappato_MCB#readme"
Changelog = "https://github.com/massimiliano-caretti/Lappato_MCB/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = { find = { include = ["lappato_mcb", "lappato_mcb.*"] } }

[tool.setuptools.package-data]
# Evidence schemas are read at runtime by lappato_mcb.validation (and the
# MCP server), so they must ship inside wheels, not only in the sdist.
"lappato_mcb.manifests" = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# E,F = pyflakes/pycodestyle errors. I = import-sort. UP = pyupgrade
# (modern Python idioms). The surface stays narrow on purpose so
# lint enforces correctness + idiomatic style, not subjective taste.
select = ["E", "F", "W", "I", "UP"]
ignore = [
  "E501",  # line length is enforced by formatter, not lint
  "E731",  # lambdas are used deliberately for inline manifest hooks
  "UP006", # `Dict[str,X]` vs `dict[str,X]` — leave deliberate uses in place
  "UP007", # `Optional[X]` vs `X | None` — same rationale
]

[tool.ruff.lint.per-file-ignores]
# Tests touch internals; allow unused imports and "useless" returns
# when they document intent.
"tests/*" = ["F401", "F811"]
