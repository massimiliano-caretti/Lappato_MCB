<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="interfaces-t interfaces-d"><title id="interfaces-t">Two interfaces, one engine</title><desc id="interfaces-d">The Python API (required, no dependencies) and the optional MCP server both call the same lappato_mcb engine; the engine never imports the MCP server.</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#818b98"/></marker></defs><rect x="0.75" y="0.75" width="1198.5" height="468.5" rx="14" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><rect x="40" y="28" width="540" height="210" rx="12" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><text x="64" y="66" font-size="21" font-weight="650" text-anchor="start" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Python API</text><text x="64" y="92" font-size="15" font-weight="400" text-anchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">for people and the code they write</text><rect x="64" y="108" width="492" height="104" rx="8" fill="#eff2f5"/><text x="80" y="134" font-size="14" font-weight="400" text-anchor="start" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">auditor = LAPPATO_MCB(root, manifest, run_tag)</text><text x="80" y="157" font-size="14" font-weight="400" text-anchor="start" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">auditor.start()  …train…  auditor.stop()</text><text x="80" y="180" font-size="14" font-weight="400" text-anchor="start" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">search_literature(&quot;conformal prediction&quot;)</text><text x="80" y="203" font-size="14" font-weight="400" text-anchor="start" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">validate_checkpoints(&quot;wdbc&quot;, root / &quot;checkpoints&quot;)</text><rect x="620" y="28" width="540" height="210" rx="12" fill="#ffffff" stroke="#eb6834" stroke-width="2" stroke-dasharray="8 6"/><text x="644" y="66" font-size="21" font-weight="650" text-anchor="start" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">MCP server</text><text x="644" y="92" font-size="15" font-weight="400" text-anchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">for AI assistants (any Model Context Protocol client)</text><rect x="644" y="110" width="135" height="26" rx="6" fill="#eff2f5"/><text x="654" y="127.86" font-size="13.5" font-weight="400" text-anchor="start" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">list_manifests</text><rect x="787" y="110" width="159" height="26" rx="6" fill="#eff2f5"/><text x="797" y="127.86" font-size="13.5" font-weight="400" text-anchor="start" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">describe_manifest</text><rect x="954" y="110" width="159" height="26" rx="6" fill="#eff2f5"/><text x="964" y="127.86" font-size="13.5" font-weight="400" text-anchor="start" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">validate_evidence</text><rect x="644" y="144" width="94" height="26" rx="6" fill="#eff2f5"/><text x="654" y="161.86" font-size="13.5" font-weight="400" text-anchor="start" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">run_audit</text><rect x="746" y="144" width="168" height="26" rx="6" fill="#eff2f5"/><text x="756" y="161.86" font-size="13.5" font-weight="400" text-anchor="start" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">get_weakness_cards</text><rect x="922" y="144" width="159" height="26" rx="6" fill="#eff2f5"/><text x="932" y="161.86" font-size="13.5" font-weight="400" text-anchor="start" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">search_literature</text><text x="644" y="200" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">+ resources lappato://manifests/{domain}, lappato://schemas/{domain}</text><rect x="40" y="250" width="428" height="28" rx="14" fill="#e3eefc"/><text x="54" y="268.86" font-size="13.5" font-weight="400" text-anchor="start" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">required · Python ≥ 3.9 · no third-party dependencies</text><rect x="620" y="250" width="458" height="28" rx="14" fill="#fdebe3"/><text x="634" y="268.86" font-size="13.5" font-weight="400" text-anchor="start" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">optional · pip install &#x27;lappato_mcb[mcp]&#x27; · Python ≥ 3.10</text><rect x="40" y="330" width="1120" height="100" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/><text x="64" y="366" font-size="19" font-weight="650" text-anchor="start" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">lappato_mcb · one engine</text><rect x="64" y="384" width="88" height="28" rx="14" fill="#f6f8fa"/><text x="74" y="402.86" font-size="13.5" font-weight="400" text-anchor="start" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">manifests</text><rect x="160" y="384" width="88" height="28" rx="14" fill="#f6f8fa"/><text x="170" y="402.86" font-size="13.5" font-weight="400" text-anchor="start" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">detectors</text><rect x="256" y="384" width="133" height="28" rx="14" fill="#f6f8fa"/><text x="266" y="402.86" font-size="13.5" font-weight="400" text-anchor="start" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">query rendering</text><rect x="397" y="384" width="148" height="28" rx="14" fill="#f6f8fa"/><text x="407" y="402.86" font-size="13.5" font-weight="400" text-anchor="start" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">4 source adapters</text><rect x="553" y="384" width="118" height="28" rx="14" fill="#f6f8fa"/><text x="563" y="402.86" font-size="13.5" font-weight="400" text-anchor="start" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">deduplication</text><rect x="679" y="384" width="72" height="28" rx="14" fill="#f6f8fa"/><text x="689" y="402.86" font-size="13.5" font-weight="400" text-anchor="start" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">scoring</text><rect x="759" y="384" width="125" height="28" rx="14" fill="#f6f8fa"/><text x="769" y="402.86" font-size="13.5" font-weight="400" text-anchor="start" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">weakness cards</text><rect x="892" y="384" width="193" height="28" rx="14" fill="#f6f8fa"/><text x="902" y="402.86" font-size="13.5" font-weight="400" text-anchor="start" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">corpus / offline replay</text><line x1="310" y1="288" x2="310" y2="326" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#a-blue)" stroke-linecap="round"/><line x1="890" y1="288" x2="890" y2="326" stroke="#eb6834" stroke-width="2.5" marker-end="url(#a-orange)" stroke-linecap="round"/><text x="904" y="314" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">imports and calls the engine</text><text x="324" y="314" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">calls the engine directly</text><text x="1136" y="366" font-size="13.5" font-weight="400" text-anchor="end" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">never imports mcp_server (checked by a test)</text></svg>
