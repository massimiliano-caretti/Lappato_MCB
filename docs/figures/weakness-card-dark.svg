<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 598" width="1200" height="598" role="img" aria-labelledby="weakness-card-t weakness-card-d"><title id="weakness-card-t">Anatomy of a weakness card</title><desc id="weakness-card-d">An abridged real weakness card in JSON with annotations: evidence and summary explain why it fired, severity how serious, queries what was asked, hit counts what came back, top papers what to read, next checks and success criteria what to do next.</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3987e5"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d95926"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/></marker></defs><rect x="0.75" y="0.75" width="1198.5" height="596.5" rx="14" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/><rect x="28" y="22" width="700" height="524" rx="10" fill="#1c2128"/><text x="46" y="50" font-size="13.5" font-weight="400" text-anchor="start" fill="#f0f6fc" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">{</text><text x="46" y="75" font-size="13.5" font-weight="400" text-anchor="start" fill="#f0f6fc" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">  &quot;weakness&quot;: &quot;heteroscedastic_residuals&quot;,</text><text x="46" y="100" font-size="13.5" font-weight="400" text-anchor="start" fill="#f0f6fc" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">  &quot;evidence&quot;: &quot;timeseries_residual_var.csv&quot;,</text><text x="46" y="125" font-size="13.5" font-weight="400" text-anchor="start" fill="#f0f6fc" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">  &quot;evidence_summary&quot;: {&quot;rows&quot;: 6, &quot;last_first_variance_ratio&quot;: 1.8484},</text><text x="46" y="150" font-size="13.5" font-weight="400" text-anchor="start" fill="#f0f6fc" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">  &quot;severity&quot;: &quot;medium&quot;,</text><text x="46" y="175" font-size="13.5" font-weight="400" text-anchor="start" fill="#f0f6fc" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">  &quot;queries&quot;: [</text><text x="46" y="200" font-size="13.5" font-weight="400" text-anchor="start" fill="#f0f6fc" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">    &quot;GARCH heteroscedasticity time series volatility c…&quot;,</text><text x="46" y="225" font-size="13.5" font-weight="400" text-anchor="start" fill="#f0f6fc" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">    &quot;log transform variance stabilisation forecasting…&quot;,</text><text x="46" y="250" font-size="13.5" font-weight="400" text-anchor="start" fill="#f0f6fc" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">  ],</text><text x="46" y="275" font-size="13.5" font-weight="400" text-anchor="start" fill="#f0f6fc" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">  &quot;raw_hits_by_source&quot;: {&quot;arXiv&quot;: 7, &quot;OpenAlex&quot;: 10, &quot;Crossref&quot;: 10, &quot;JOSS&quot;: 10},</text><text x="46" y="300" font-size="13.5" font-weight="400" text-anchor="start" fill="#f0f6fc" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">  &quot;n_papers_kept&quot;: 31,</text><text x="46" y="325" font-size="13.5" font-weight="400" text-anchor="start" fill="#f0f6fc" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">  &quot;top_papers&quot;: [{</text><text x="46" y="350" font-size="13.5" font-weight="400" text-anchor="start" fill="#f0f6fc" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">    &quot;source&quot;: &quot;OpenAlex&quot;, &quot;year&quot;: &quot;2025&quot;, &quot;score&quot;: 22.75,</text><text x="46" y="375" font-size="13.5" font-weight="400" text-anchor="start" fill="#f0f6fc" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">    &quot;title&quot;: &quot;SSA-ARIMA-GARCH Hybrid Model for Time Series…&quot;</text><text x="46" y="400" font-size="13.5" font-weight="400" text-anchor="start" fill="#f0f6fc" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">  }, … 9 more],</text><text x="46" y="425" font-size="13.5" font-weight="400" text-anchor="start" fill="#f0f6fc" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">  &quot;next_checks&quot;: [</text><text x="46" y="450" font-size="13.5" font-weight="400" text-anchor="start" fill="#f0f6fc" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">    &quot;Plot residual variance by rolling-origin fold.&quot;, …],</text><text x="46" y="475" font-size="13.5" font-weight="400" text-anchor="start" fill="#f0f6fc" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">  &quot;success_criteria&quot;: [</text><text x="46" y="500" font-size="13.5" font-weight="400" text-anchor="start" fill="#f0f6fc" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">    &quot;Last/first residual variance ratio falls below 1.5.&quot;, …]</text><text x="46" y="525" font-size="13.5" font-weight="400" text-anchor="start" fill="#f0f6fc" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">}</text><path d="M714,85 h8 V131 h-8" stroke="#3987e5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M722,107.5 C740,107.5 736,107.5 754,107.5" stroke="#3987e5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="762" y="112.5" font-size="15.5" font-weight="650" text-anchor="start" fill="#f0f6fc" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Why it fired</text><text x="762" y="133.5" font-size="13.5" font-weight="400" text-anchor="start" fill="#9198a1" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">The evidence file and the statistic the</text><text x="762" y="151.5" font-size="13.5" font-weight="400" text-anchor="start" fill="#9198a1" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">manifest computed from it.</text><path d="M714,135 h8 V156 h-8" stroke="#3987e5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M722,145.0 C740,145.0 736,179.5 754,179.5" stroke="#3987e5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="762" y="184.5" font-size="15.5" font-weight="650" text-anchor="start" fill="#f0f6fc" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">How serious</text><text x="762" y="205.5" font-size="13.5" font-weight="400" text-anchor="start" fill="#9198a1" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Graded by the manifest&#x27;s thresholds, not by a</text><text x="762" y="223.5" font-size="13.5" font-weight="400" text-anchor="start" fill="#9198a1" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">model.</text><path d="M714,160 h8 V231 h-8" stroke="#3987e5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M722,195.0 C740,195.0 736,251.5 754,251.5" stroke="#3987e5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="762" y="256.5" font-size="15.5" font-weight="650" text-anchor="start" fill="#f0f6fc" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">What was asked</text><text x="762" y="277.5" font-size="13.5" font-weight="400" text-anchor="start" fill="#9198a1" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">The exact queries sent to each source, after</text><text x="762" y="295.5" font-size="13.5" font-weight="400" text-anchor="start" fill="#9198a1" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">context substitution.</text><path d="M714,260 h8 V306 h-8" stroke="#3987e5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M722,282.5 C740,282.5 736,323.5 754,323.5" stroke="#3987e5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="762" y="328.5" font-size="15.5" font-weight="650" text-anchor="start" fill="#f0f6fc" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">What came back</text><text x="762" y="349.5" font-size="13.5" font-weight="400" text-anchor="start" fill="#9198a1" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Hits per source before deduplication; papers</text><text x="762" y="367.5" font-size="13.5" font-weight="400" text-anchor="start" fill="#9198a1" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">kept after it.</text><path d="M714,310 h8 V406 h-8" stroke="#3987e5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M722,357.5 C740,357.5 736,395.5 754,395.5" stroke="#3987e5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="762" y="400.5" font-size="15.5" font-weight="650" text-anchor="start" fill="#f0f6fc" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">What to read</text><text x="762" y="421.5" font-size="13.5" font-weight="400" text-anchor="start" fill="#9198a1" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Ranked by a deterministic lexical score — a</text><text x="762" y="439.5" font-size="13.5" font-weight="400" text-anchor="start" fill="#9198a1" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">pointer, not a relevance judgement.</text><path d="M714,410 h8 V506 h-8" stroke="#3987e5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M722,457.5 C740,457.5 736,467.5 754,467.5" stroke="#3987e5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="762" y="472.5" font-size="15.5" font-weight="650" text-anchor="start" fill="#f0f6fc" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">What to do next</text><text x="762" y="493.5" font-size="13.5" font-weight="400" text-anchor="start" fill="#9198a1" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Written by the manifest author and versioned</text><text x="762" y="511.5" font-size="13.5" font-weight="400" text-anchor="start" fill="#9198a1" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">with it; never generated.</text><text x="28" y="578" font-size="13.5" font-weight="400" text-anchor="start" fill="#6e7681" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">A real card (abridged) from the complete time-series demo cycle of 2026-10-22. Full field list in the reference section.</text></svg>
