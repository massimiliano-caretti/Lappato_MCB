<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490" role="img" aria-labelledby="overview-t overview-d"><title id="overview-t">LAPPATO_MCB at a glance</title><desc id="overview-d">Three panels: a pipeline writes evidence CSVs to checkpoints; LAPPATO_MCB detects weaknesses against thresholds and retrieves literature from arXiv, OpenAlex, Crossref and JOSS; it emits weakness cards such as heteroscedastic_residuals with severity medium.</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#818b98"/></marker></defs><rect x="0.75" y="0.75" width="1198.5" height="488.5" rx="14" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><rect x="28" y="28" width="340" height="392" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/><circle cx="58" cy="62" r="15" fill="#2a78d6"/><text x="58" y="67.5" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">1</text><text x="84" y="68" font-size="20" font-weight="650" text-anchor="start" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Your pipeline</text><text x="52" y="100" font-size="15" font-weight="400" text-anchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">writes the diagnostics it already computes</text><rect x="430" y="28" width="340" height="392" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/><circle cx="460" cy="62" r="15" fill="#2a78d6"/><text x="460" y="67.5" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">2</text><text x="486" y="68" font-size="20" font-weight="650" text-anchor="start" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">LAPPATO_MCB</text><text x="454" y="100" font-size="15" font-weight="400" text-anchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">reads them, then searches the literature</text><rect x="832" y="28" width="340" height="392" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/><circle cx="862" cy="62" r="15" fill="#2a78d6"/><text x="862" y="67.5" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">3</text><text x="888" y="68" font-size="20" font-weight="650" text-anchor="start" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Weakness cards</text><text x="856" y="100" font-size="15" font-weight="400" text-anchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">one per weakness the evidence supports</text><line x1="376" y1="224.0" x2="422" y2="224.0" stroke="#59636e" stroke-width="2.5" marker-end="url(#a-ink)" stroke-linecap="round"/><line x1="778" y1="224.0" x2="824" y2="224.0" stroke="#59636e" stroke-width="2.5" marker-end="url(#a-ink)" stroke-linecap="round"/><text x="52" y="130" font-size="16" font-weight="600" text-anchor="start" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">checkpoints/</text><path d="M60,138 V165 H76" stroke="#d1d9e0" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="80" y="152" width="242" height="26" rx="6" fill="#e3eefc"/><text x="90" y="169.86" font-size="13.5" font-weight="400" text-anchor="start" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">timeseries_residual_var.csv</text><path d="M60,138 V203 H76" stroke="#d1d9e0" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="80" y="190" width="234" height="26" rx="6" fill="#eff2f5"/><text x="90" y="207.86" font-size="13.5" font-weight="400" text-anchor="start" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">timeseries_per_horizon.csv</text><path d="M60,138 V241 H76" stroke="#d1d9e0" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="80" y="228" width="242" height="26" rx="6" fill="#eff2f5"/><text x="90" y="245.86" font-size="13.5" font-weight="400" text-anchor="start" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">timeseries_residual_acf.csv</text><path d="M60,138 V279 H76" stroke="#d1d9e0" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="80" y="266" width="275" height="26" rx="6" fill="#eff2f5"/><text x="90" y="283.86" font-size="13.5" font-weight="400" text-anchor="start" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">timeseries_lappato_context.json</text><text x="52" y="334" font-size="14" font-weight="400" text-anchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">A CSV that is missing or unreadable</text><text x="52" y="354" font-size="14" font-weight="400" text-anchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">keeps its detectors silent</text><text x="52" y="374" font-size="14" font-weight="400" text-anchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">(fail-closed). The JSON context is</text><text x="52" y="394" font-size="14" font-weight="400" text-anchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">optional.</text><rect x="454" y="112" width="292" height="112" rx="10" fill="#f6f8fa"/><text x="470" y="140" font-size="16" font-weight="650" text-anchor="start" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Detect</text><text x="470" y="166" font-size="14" font-weight="400" text-anchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">193 detectors in 35 manifests</text><text x="470" y="186" font-size="14" font-weight="400" text-anchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">compare evidence with documented</text><text x="470" y="206" font-size="14" font-weight="400" text-anchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">thresholds.</text><rect x="454" y="238" width="292" height="160" rx="10" fill="#f6f8fa"/><text x="470" y="266" font-size="16" font-weight="650" text-anchor="start" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Retrieve</text><rect x="470" y="280" width="54" height="26" rx="13" fill="#ffffff"/><text x="479" y="297.68" font-size="13" font-weight="400" text-anchor="start" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">arXiv</text><rect x="530" y="280" width="76" height="26" rx="13" fill="#ffffff"/><text x="539" y="297.68" font-size="13" font-weight="400" text-anchor="start" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">OpenAlex</text><rect x="612" y="280" width="76" height="26" rx="13" fill="#ffffff"/><text x="621" y="297.68" font-size="13" font-weight="400" text-anchor="start" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Crossref</text><rect x="694" y="280" width="47" height="26" rx="13" fill="#ffffff"/><text x="703" y="297.68" font-size="13" font-weight="400" text-anchor="start" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">JOSS</text><text x="470" y="330" font-size="14" font-weight="400" text-anchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Targeted queries, cross-source</text><text x="470" y="350" font-size="14" font-weight="400" text-anchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">deduplication (τ = 0.80),</text><text x="470" y="370" font-size="14" font-weight="400" text-anchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">deterministic scoring.</text><text x="856" y="130" font-size="15" font-weight="600" text-anchor="start" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">heteroscedastic_residuals</text><circle cx="863" cy="150" r="6" fill="#fab219"/><text x="876" y="155" font-size="14.5" font-weight="400" text-anchor="start" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">severity: medium</text><text x="856" y="190" font-size="14" font-weight="400" text-anchor="start" fill="#818b98" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">evidence</text><text x="968" y="190" font-size="14" font-weight="400" text-anchor="start" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">variance ratio 1.848</text><text x="856" y="218" font-size="14" font-weight="400" text-anchor="start" fill="#818b98" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">threshold</text><text x="968" y="218" font-size="14" font-weight="400" text-anchor="start" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">&gt; 1.5</text><text x="856" y="246" font-size="14" font-weight="400" text-anchor="start" fill="#818b98" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">queries sent</text><text x="968" y="246" font-size="14" font-weight="400" text-anchor="start" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">2</text><text x="856" y="274" font-size="14" font-weight="400" text-anchor="start" fill="#818b98" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">papers kept</text><text x="968" y="274" font-size="14" font-weight="400" text-anchor="start" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">31</text><text x="856" y="302" font-size="14" font-weight="400" text-anchor="start" fill="#818b98" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">next check</text><text x="968" y="302" font-size="14" font-weight="400" text-anchor="start" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve"></text><text x="856" y="323" font-size="14" font-weight="400" text-anchor="start" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Plot residual variance by</text><text x="856" y="342" font-size="14" font-weight="400" text-anchor="start" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">rolling-origin fold.</text><text x="856" y="392" font-size="13" font-weight="400" text-anchor="start" fill="#818b98" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">JSON for tools · Markdown log + PDF for people</text><text x="28" y="464" font-size="13.5" font-weight="400" text-anchor="start" fill="#818b98" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Values from one complete cycle on the bundled time-series demo (2026-10-22). Python standard library only.</text></svg>
