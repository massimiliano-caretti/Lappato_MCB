nchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">meta.csv row per cycle</text><text x="904" y="504" font-size="12.5" font-weight="600" text-anchor="start" fill="#2a78d6" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">per active weakness</text><path d="M1017.0,244 V270 H159.0 V324" stroke="#59636e" stroke-width="2" fill="none" marker-end="url(#a-ink)" stroke-linecap="round" stroke-linejoin="round"/><text x="354" y="264" font-size="13" font-weight="400" text-anchor="start" fill="#818b98" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">continues for each active weakness</text><path d="M1148,424.0 H1186 V26 H58 V48" stroke="#2a78d6" stroke-width="2" fill="none" stroke-dasharray="6 6" marker-end="url(#a-blue)" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="16" font-size="13" font-weight="400" text-anchor="start" fill="#2a78d6" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">next cycle (daemon only) · stop() ends the loop</text></svg>
