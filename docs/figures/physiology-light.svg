<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="physiology-t physiology-d"><title id="physiology-t">Physiology: one monitoring cycle</title><desc id="physiology-d">Eight steps in code order: read context, gate on evidence, grade severity, render queries, fetch from sources, filter and score, optional rerank, record outputs; then repeat.</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#818b98"/></marker></defs><rect x="0.75" y="0.75" width="1198.5" height="598.5" rx="14" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><text x="28" y="578" font-size="13.5" font-weight="400" text-anchor="start" fill="#818b98" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Steps in code order (LAPPATO_MCB._run_cycle). Daemon: repeats every poll_interval, default 90 s · run_once(): a single cycle.</text><rect x="28" y="52" width="262" height="188" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/><circle cx="58" cy="84" r="15" fill="#2a78d6"/><text x="58" y="89.5" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">1</text><text x="82" y="90" font-size="17.5" font-weight="650" text-anchor="start" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Read context</text><rect x="44" y="108" width="230" height="30" rx="6" fill="#eff2f5"/><text x="54" y="128" font-size="13" font-weight="400" text-anchor="start" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">_load_context()</text><text x="46" y="164" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">optional lappato_context.json</text><text x="46" y="183" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">fills {domain}, {task},</text><text x="46" y="202" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">{model_family}</text><text x="46" y="226" font-size="12.5" font-weight="600" text-anchor="start" fill="#2a78d6" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">per cycle</text><line x1="293" y1="146.0" x2="311" y2="146.0" stroke="#59636e" stroke-width="2" marker-end="url(#a-ink)" stroke-linecap="round"/><rect x="314" y="52" width="262" height="188" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/><circle cx="344" cy="84" r="15" fill="#2a78d6"/><text x="344" y="89.5" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">2</text><text x="368" y="90" font-size="17.5" font-weight="650" text-anchor="start" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Gate</text><rect x="330" y="108" width="230" height="30" rx="6" fill="#eff2f5"/><text x="340" y="128" font-size="13" font-weight="400" text-anchor="start" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">evidence_check(csv)</text><text x="332" y="164" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">missing or unreadable CSV ⇒</text><text x="332" y="183" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">inactive: nothing is fetched</text><text x="332" y="226" font-size="12.5" font-weight="600" text-anchor="start" fill="#2a78d6" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">per weakness</text><line x1="579" y1="146.0" x2="597" y2="146.0" stroke="#59636e" stroke-width="2" marker-end="url(#a-ink)" stroke-linecap="round"/><rect x="600" y="52" width="262" height="188" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/><circle cx="630" cy="84" r="15" fill="#2a78d6"/><text x="630" y="89.5" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">3</text><text x="654" y="90" font-size="17.5" font-weight="650" text-anchor="start" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Grade</text><rect x="616" y="108" width="230" height="30" rx="6" fill="#eff2f5"/><text x="626" y="128" font-size="13" font-weight="400" text-anchor="start" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">severity(csv)</text><text x="618" y="164" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">evidence_summary(csv) too ·</text><text x="618" y="183" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">info, low, medium, high,</text><text x="618" y="202" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">critical</text><text x="618" y="226" font-size="12.5" font-weight="600" text-anchor="start" fill="#2a78d6" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">per active weakness</text><line x1="865" y1="146.0" x2="883" y2="146.0" stroke="#59636e" stroke-width="2" marker-end="url(#a-ink)" stroke-linecap="round"/><rect x="886" y="52" width="262" height="188" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/><circle cx="916" cy="84" r="15" fill="#2a78d6"/><text x="916" y="89.5" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">4</text><text x="940" y="90" font-size="17.5" font-weight="650" text-anchor="start" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Render queries</text><rect x="902" y="108" width="230" height="30" rx="6" fill="#eff2f5"/><text x="912" y="128" font-size="13" font-weight="400" text-anchor="start" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">_render_query_template()</text><text x="904" y="164" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">the manifest&#x27;s 2–3 queries,</text><text x="904" y="183" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">context substituted</text><text x="904" y="226" font-size="12.5" font-weight="600" text-anchor="start" fill="#2a78d6" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">per active weakness</text><rect x="28" y="330" width="262" height="188" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/><circle cx="58" cy="362" r="15" fill="#2a78d6"/><text x="58" y="367.5" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">5</text><text x="82" y="368" font-size="17.5" font-weight="650" text-anchor="start" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Fetch</text><rect x="44" y="386" width="230" height="30" rx="6" fill="#eff2f5"/><text x="54" y="406" font-size="13" font-weight="400" text-anchor="start" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">_fetch(source, query)</text><text x="46" y="442" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">online: polite delays, 2</text><text x="46" y="461" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">retries · offline: local corpus</text><text x="46" y="504" font-size="12.5" font-weight="600" text-anchor="start" fill="#2a78d6" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">per query × source</text><line x1="293" y1="424.0" x2="311" y2="424.0" stroke="#59636e" stroke-width="2" marker-end="url(#a-ink)" stroke-linecap="round"/><rect x="314" y="330" width="262" height="188" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/><circle cx="344" cy="362" r="15" fill="#2a78d6"/><text x="344" y="367.5" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">6</text><text x="368" y="368" font-size="17.5" font-weight="650" text-anchor="start" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Filter &amp; score</text><rect x="330" y="386" width="230" height="30" rx="6" fill="#eff2f5"/><text x="340" y="406" font-size="13" font-weight="400" text-anchor="start" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">_consider_hit()</text><text x="332" y="442" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">id dedup → title dedup (τ 0.80)</text><text x="332" y="461" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">→ score; kept hit →</text><text x="332" y="480" font-size="13.5" font-weight="400" text-anchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">papers.jsonl + corpus</text><text x="332" y="504" font-size="12.5" font-weight="600" text-anchor="start" fill="#2a78d6" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">per hit</text><line x1="579" y1="424.0" x2="597" y2="424.0" stroke="#59636e" stroke-width="2" marker-end="url(#a-ink)" stroke-linecap="round"/><rect x="600" y="330" width="262" height="188" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/><circle cx="630" cy="362" r="15" fill="#2a78d6"/><text x="630" y="367.5" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">7</text><text x="654" y="368" font-size="17.5" font-weight="650" text-anchor="start" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Rank</text><rect x="616" y="386" width="230" height="30" rx="6" fill="#eff2f5"/><text x="626" y="406" font-size="13" font-weight="400" text-anchor="start" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">_apply_reranker()</text><text x="618" y=