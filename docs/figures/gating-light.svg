<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 492" width="1200" height="492" role="img" aria-labelledby="gating-t gating-d"><title id="gating-t">How a detector decides</title><desc id="gating-d">Two number lines with threshold bands. Time-series residual variance ratio 1.848 is above the 1.5 threshold, so the detector is active with severity medium. WDBC mean Brier 0.027 is below 0.10, so that detector stays inactive and sends no query.</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#818b98"/></marker></defs><rect x="0.75" y="0.75" width="1198.5" height="490.5" rx="14" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><rect x="28" y="30" width="1144" height="196" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/><text x="60" y="66" font-size="17" font-weight="600" text-anchor="start" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">timeseries · heteroscedastic_residuals</text><text x="60" y="90" font-size="14" font-weight="400" text-anchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">last-fold / first-fold residual variance</text><rect x="61.0" y="126" width="214.0" height="34" rx="4" fill="#f6f8fa" opacity="1"/><text x="168.0" y="148" font-size="13.5" font-weight="500" text-anchor="middle" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">inactive — no query sent</text><rect x="277.0" y="126" width="646.0" height="34" rx="4" fill="#fab219" opacity="0.9"/><text x="600.0" y="148" font-size="13.5" font-weight="650" text-anchor="middle" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">medium</text><rect x="925.0" y="126" width="214.0" height="34" rx="4" fill="#ec835a" opacity="0.9"/><text x="1032.0" y="148" font-size="13.5" font-weight="650" text-anchor="middle" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">high</text><text x="276.0" y="182" font-size="13" font-weight="400" text-anchor="middle" fill="#818b98" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">1.5</text><text x="924.0" y="182" font-size="13" font-weight="400" text-anchor="middle" fill="#818b98" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">3</text><text x="60.0" y="182" font-size="13" font-weight="400" text-anchor="start" fill="#818b98" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">1</text><path d="M426.5,122 l-8,-14 h16 z" fill="#1f2328"/><line x1="426.5088" y1="122" x2="426.5088" y2="164" stroke="#1f2328" stroke-width="2" stroke-linecap="round"/><text x="438.5088" y="114" font-size="14.5" font-weight="600" text-anchor="start" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">measured 1.848 → active · severity medium</text><rect x="28" y="244" width="1144" height="196" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/><text x="60" y="280" font-size="17" font-weight="600" text-anchor="start" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">wdbc · low_calibration</text><text x="60" y="304" font-size="14" font-weight="400" text-anchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">mean Brier score across folds</text><rect x="61.0" y="340" width="430.0" height="34" rx="4" fill="#f6f8fa" opacity="1"/><text x="276.0" y="362" font-size="13.5" font-weight="500" text-anchor="middle" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">inactive — no query sent</text><rect x="493.0" y="340" width="214.0" height="34" rx="4" fill="#fab219" opacity="0.9"/><text x="600.0" y="362" font-size="13.5" font-weight="650" text-anchor="middle" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">medium</text><rect x="709.0" y="340" width="214.0" height="34" rx="4" fill="#ec835a" opacity="0.9"/><text x="816.0" y="362" font-size="13.5" font-weight="650" text-anchor="middle" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">high</text><rect x="925.0" y="340" width="214.0" height="34" rx="4" fill="#d03b3b" opacity="0.9"/><text x="1032.0" y="362" font-size="13.5" font-weight="650" text-anchor="middle" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">critical</text><text x="492.0" y="396" font-size="13" font-weight="400" text-anchor="middle" fill="#818b98" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">0.1</text><text x="708.0" y="396" font-size="13" font-weight="400" text-anchor="middle" fill="#818b98" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">0.15</text><text x="924.0" y="396" font-size="13" font-weight="400" text-anchor="middle" fill="#818b98" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" xml:space="preser