<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="social-t social-d"><title id="social-t">LAPPATO_MCB</title><desc id="social-d">Social preview card.</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#818b98"/></marker></defs><rect x="0.75" y="0.75" width="1278.5" height="638.5" rx="14" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><rect x="0" y="0" width="1280" height="640" rx="0" fill="#f6f8fa"/><text x="80" y="170" font-size="84" font-weight="750" text-anchor="start" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">LAPPATO_MCB</text><text x="84" y="222" font-size="28" font-weight="400" text-anchor="start" fill="#59636e" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Literature-Aware Pipeline Partner for Adaptive Transplant Optimization</text><text x="84" y="300" font-size="27" font-weight="400" text-anchor="start" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">A Python library that reads the diagnostics an ML pipeline already</text><text x="84" y="340" font-size="27" font-weight="400" text-anchor="start" fill="#1f2328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">writes, flags methodological weaknesses when measured